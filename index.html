<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grades 6–8 & Algebra I · TEKS Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2a2a; --ink-2:#4a5a5a; --ink-3:#7b8a8a;
    --paper:#ffffff; --paper-2:#f3f7f6; --line:#d5dfde;
    --teal:#147c78; --teal-deep:#0d5f5c; --teal-tint:#d7ebe9; --teal-ghost:#eef6f5;
    --slate:#e4e6e6; --slate-ink:#5c6666;
    --focus:#ffb703;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:var(--teal-deep)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  header{border-bottom:2px solid var(--teal);padding:20px 24px 14px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  header h1 small{display:block;font-size:14px;font-weight:400;color:var(--ink-2);margin-top:2px}
  .search{flex:1 1 320px;position:relative;max-width:560px}
  .search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper)}
  .search input:focus{border-color:var(--teal)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2}

  .tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
  .tabs button{white-space:nowrap;flex:none}
  @media (max-width:600px){header,main,footer{padding-left:16px;padding-right:16px}.tabs{padding-left:16px;padding-right:16px}}
  .tabs button{padding:9px 14px;border-radius:8px 8px 0 0;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected="true"]{color:var(--teal-deep);border-bottom-color:var(--teal);font-weight:700}

  main{padding:18px 24px 40px}
  .view{display:none}.view.on{display:block}

  /* legend */
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--ink-2);margin:0 0 18px;padding:10px 14px;background:var(--paper-2);border-radius:8px}
  .legend .lab{font-weight:700;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .sample{font-style:normal;padding:4px 10px;border-radius:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;line-height:1.1}
  .legend .sample.R{background:var(--teal-tint);border-color:var(--teal)}
  .legend .sample.U{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
  .legend .sep{width:1px;height:18px;background:var(--line)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);vertical-align:middle}
  .dot.F{background:var(--ink)}
  .dot.I{border-radius:1px;transform:rotate(45deg) scale(.85);background:#7a5ea8;border-color:#7a5ea8}
  .mk.I{border-color:#b9a6da;background:#f4f0fa}
  .mk.I.R{background:var(--teal-tint);border-color:#7a5ea8}
  .course{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--teal);border-radius:8px;overflow:hidden;align-self:center}
  .course button{padding:8px 14px;font-size:15px;color:var(--teal-deep)}
  .course button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
  .day.k-alg{background:#f3f0fa} .day.k-alg .txt{color:#4b3a6e}
  .day.re{background:#fbf7ec}
  .day .reflag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#5a4300;color:#fff;margin-bottom:3px}
  .when.re{background:#fbf7ec;border-color:#d9c48f;color:#5a4300}
  .pctl select{font:inherit;font-size:14px;padding:3px 6px;border:1.5px solid var(--line);border-radius:6px}
  .src{font-size:12px;color:#5b4a80;font-style:italic}

  /* by standard */
  .split{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;align-items:start}
  .split>.pane{background:#e9f0ef;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .pane .chip{background:#fff}
  .pane .chip.R{background:var(--teal-tint)}
  .pane .chip.U{background:#d8dcdc}
  .pane .chip.sel{background:var(--teal)}
  @media (max-width:820px){.split{grid-template-columns:1fr}}
  .strand{margin:0 0 14px}
  .strand h3{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 10px;border-radius:6px;border:1.5px solid var(--line);font-size:14px;line-height:1.1;background:#fff;color:var(--ink)}
  .chip.R{background:var(--teal-tint);border-color:var(--teal)}
  .chip.U{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
  .chip.none{opacity:.45}
  .chip.sel{background:var(--teal);border-color:var(--teal);color:#fff}
  .chip.hide{display:none}
  .filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px;font-size:14px;color:var(--ink-2)}
  .filters label{display:inline-flex;gap:6px;align-items:center}

  .detail{position:sticky;top:12px;min-height:200px}
  .detail .code{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;margin:0}
  .tag{display:inline-block;font-size:13px;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;border:1.5px solid var(--line)}
  .tag.R{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-deep)}
  .tag.U{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
  .desc{margin:12px 0 18px;max-width:64ch;color:var(--ink-2)}
  .empty{color:var(--ink-3);padding:20px 0}
  .mod{margin:0 0 16px}
  .mod h4{margin:0 0 4px;font-size:14px;color:var(--teal-deep);font-weight:700}
  .lesson{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin:0 0 6px;text-align:left;width:100%}
  .lesson:hover{background:var(--teal-ghost)}
  .lesson .where{font-size:13px;color:var(--ink-3)}
  .when{display:inline-block;font-style:normal;font-size:12px;line-height:1.2;padding:2px 7px;border-radius:4px;background:#fff3d6;border:1px solid #f0c96b;color:#5a4300;white-space:nowrap;vertical-align:middle}
  .when.none{background:#f1f1f1;border-color:#ddd;color:var(--ink-3)}
  .when.after{background:#fde2e1;border-color:#e8a29e;color:#7a1f1a}
  .whenrow{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
  .pacesum{font-size:14px;color:var(--ink-2);margin:0 0 10px}
  .pacesum b{font-weight:700}
  .qtog{display:inline-flex;gap:4px;align-items:center}
  .qtog button{font-size:13px;padding:3px 8px;border:1.5px solid var(--line);border-radius:5px;background:#fff;color:var(--ink-2)}
  .qtog button[aria-pressed="true"]{background:#5a4300;border-color:#5a4300;color:#fff}
  .lesson b{font-weight:700}
  .lesson .sub{color:var(--ink-2);font-size:14px}
  .count{font-size:14px;color:var(--ink-3);margin:0 0 10px}

  /* by lesson */
  .modlist details{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
  .modlist summary{cursor:pointer;padding:12px 14px;font-weight:700;background:var(--paper-2);list-style:none;display:flex;justify-content:space-between;gap:10px}
  .modlist summary::-webkit-details-marker{display:none}
  .modlist summary .n{color:var(--ink-3);font-weight:400}
  .topic{padding:8px 14px 4px}
  .topic h5{margin:6px 0 6px;font-size:13px;color:var(--ink-2);font-weight:700}
  .lrow{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:baseline;padding:7px 8px;border-radius:6px;width:100%;text-align:left}
  .lrow:hover{background:var(--teal-ghost)}
  .lrow .t b{font-weight:700} .lrow .t span{color:var(--ink-2);font-size:14px}
  .lrow .marks{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .mk{font-size:13px;padding:2px 7px;border-radius:5px;border:1.5px solid var(--line);white-space:nowrap}
  .mk.R{background:var(--teal-tint);border-color:var(--teal)} .mk.U{background:var(--slate)}
  .mk.O{border-style:dashed}
  .mk.none{color:var(--ink-3);border:0;padding-left:0}
  .lrow.hide,.topic.hide{display:none}

  /* grid */
  .gridwrap{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:10px}
  table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
  table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:26px}
  table.grid thead th{position:sticky;top:0;background:var(--paper);z-index:2;height:64px;vertical-align:bottom;min-width:26px}
  table.grid thead th span{writing-mode:vertical-rl;transform:rotate(180deg);display:block;padding:6px 0 4px;font-weight:400;color:var(--ink-2)}
  table.grid thead th.R{background:var(--teal-tint)} table.grid thead th.U{background:var(--slate)}
  table.grid td.R{background:var(--teal-ghost)} table.grid td.U{background:#f0f1f1}
  table.grid th.lab{position:sticky;left:0;background:var(--paper);z-index:1;text-align:left;font-weight:400;padding:0 10px;white-space:nowrap;min-width:230px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
  table.grid thead th.lab{z-index:3}
  table.grid th.lab b{font-weight:700}
  table.grid th.lab small{color:var(--ink-3);margin-right:6px}
  table.grid tr.modhead th{background:var(--paper-2);font-weight:700;text-align:left;padding:4px 10px;position:sticky;left:0;z-index:1}
  table.grid td{text-align:center}
  table.grid td button{width:100%;height:100%;display:block}
  table.grid td .dot{width:9px;height:9px;border-width:1.5px}
  table.grid td button:hover{background:var(--focus)}
  table.grid th.hl,table.grid td.hl{background:#fff1c2!important;box-shadow:inset 2px 0 0 var(--focus),inset -2px 0 0 var(--focus)}
  table.grid thead th.hl span{color:var(--ink);font-weight:700}
  table.grid th.hl2,table.grid td.hl2{background:#fff8e1!important}
  .gridctl{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:14px;color:var(--ink-2)}
  .gridctl label{display:inline-flex;gap:6px;align-items:center}

  /* STAAR performance */
  .perf{margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
  .perf h4{margin:0 0 4px;font-size:15px}
  .perf .note{font-size:13px;color:var(--ink-3);margin:0 0 10px}
  .yr{margin:0 0 12px}
  .yr h5{margin:0 0 6px;font-size:13px;color:var(--ink-2);font-weight:700}
  .item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px}
  .item .head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
  .item .head b{font-size:15px}
  .item .meta{color:var(--ink-3);font-size:13px}
  .bar{position:relative;height:10px;border-radius:5px;background:#eceff0;flex:1 1 140px;max-width:260px;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
  .bar i.p{background:#8fcbc7}
  .pct{font-weight:700;min-width:46px;text-align:right}
  .pct.low{color:#b3261e}
  .credit{font-size:13px;color:var(--ink-2)}
  .choices{display:flex;gap:6px;margin:6px 0 0;font-size:13px}
  .choices span{padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
  .choices span.ok{background:var(--teal-tint);border-color:var(--teal);font-weight:700}
  .choices span.hot{border-color:#e0a800;background:#fff6d6}
  .item details{margin-top:8px}
  .item summary{cursor:pointer;font-size:14px;color:var(--teal-deep)}
  .item img{display:block;max-width:100%;height:auto;margin-top:8px;border:1px solid var(--line);border-radius:6px}
  .notested{font-size:14px;color:var(--ink-3);margin:0 0 8px}
  .cluster{font-size:13px;color:var(--ink-3);margin:-8px 0 14px}
  /* performance table */
  .ptab{border-collapse:collapse;width:100%;font-size:14px}
  .ptab th,.ptab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .ptab th{position:sticky;top:0;background:var(--paper);font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  .ptab th.sorted{color:var(--teal-deep)}
  .ptab td.num{text-align:right;font-variant-numeric:tabular-nums}
  .ptab tr:hover td{background:var(--teal-ghost)}
  .ptab .code{font-weight:700;font-size:14px;letter-spacing:0}
  .ptab .code button{font-weight:700;color:var(--teal-deep)}
  .ptab .qs{color:var(--ink-3);font-size:12px}
  .ptab td.les{min-width:220px}
  .ptab .lk{text-align:left;color:var(--ink);display:inline-flex;gap:6px;align-items:center;padding:1px 0}
  .ptab .lk:hover{color:var(--teal-deep);text-decoration:underline}
  .ptab .lk .dot{width:8px;height:8px;border-width:1.5px;flex:none}
  .ptab td.low{color:#b3261e;font-weight:700}
  .pctl{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:14px;color:var(--ink-2);align-items:center}
  /* vertical alignment */
  .va .ladder{list-style:none;margin:6px 0 14px;padding:0;border-left:3px solid var(--line)}
  .va .ladder li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:5px 0 5px 12px;font-size:14px;align-items:start}
  .va .ladder li.g6{border-left:3px solid var(--teal);margin-left:-3px}
  .va .ladder li.me{background:var(--teal-ghost);border-left:3px solid var(--ink);margin-left:-3px}
  .va .ladder .c{font-weight:700;white-space:nowrap}
  .va .ladder .c button{font-weight:700;color:var(--teal-deep);text-decoration:underline;text-underline-offset:2px}
  .va .ladder .t{color:var(--ink-2)}
  .va .ladder .ty{font-size:12px;color:var(--ink-3);display:block;font-weight:400}
  .va .gr{font-size:12px;color:var(--ink-3);display:block;font-weight:400}
  .va .sum{margin:0 0 10px;font-size:14px}
  .va .sum b{font-weight:700}
  /* calendar */
  .calctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px;font-size:14px;color:var(--ink-2)}
  .calctl .qtog button.now{border-color:#0d5f5c;color:#0d5f5c;font-weight:700}
  .calwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:80vh}
  table.cal{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;font-size:13px}
  table.cal th{position:sticky;top:0;background:var(--paper-2);z-index:2;padding:8px 10px;text-align:left;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line)}
  table.cal td{vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;width:18%}
  table.cal td.wk{width:10%;padding:10px;background:var(--paper-2);position:sticky;left:0;z-index:1;border-right:2px solid var(--line)}
  table.cal td.wk b{display:block;font-size:14px} table.cal td.wk span{color:var(--ink-3);font-size:12px}
  table.cal tr.qhead td{background:#e9f0ef;font-weight:700;padding:8px 10px;color:var(--teal-deep);position:sticky;left:0}
  .day{padding:8px 9px;min-height:96px;position:relative}
  .day .d{font-size:12px;color:var(--ink-3);margin-bottom:4px}
  .day .d b{color:var(--ink);font-weight:700;margin-right:4px}
  .day.k-off{background:#f4f4f4} .day.k-off .txt{color:var(--ink-3);font-style:italic}
  .day.k-assess{background:#fff8e6} .day.k-assess .txt{color:#5a4300}
  .day.k-staar{background:#fde2e1} .day.k-staar .txt{color:#7a1f1a;font-weight:700}
  .day .ttl{font-weight:700;color:var(--ink);text-align:left;line-height:1.25;display:block;padding:0}
  .day .ttl:hover{color:var(--teal-deep);text-decoration:underline}
  .day .sub{color:var(--ink-2);font-size:12px;margin:2px 0 4px;line-height:1.25}
  .day .mks{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0}
  .day .mks .mk{font-size:11px;padding:1px 5px}
  .day .act{color:var(--ink-3);font-size:11px}
  .day.today{box-shadow:inset 0 0 0 3px var(--teal)}
  .day.today .d b::after{content:'today';font-size:10px;font-weight:400;color:#fff;background:var(--teal);padding:1px 5px;border-radius:3px;margin-left:6px}
  .day.hit{box-shadow:inset 0 0 0 3px var(--focus)}
  .day.today.hit{box-shadow:inset 0 0 0 3px var(--teal),inset 0 0 0 6px var(--focus)}
  tr.thisweek td.wk{background:var(--teal-tint)}
  .when.link{cursor:pointer} .when.link:hover{text-decoration:underline}
  footer{padding:14px 24px 28px;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line)}
  .kbd{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-2)}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Grade 8 · TEKS Lookup<small id="subttl">Texas Math Solution (Carnegie Learning) · standards ↔ lessons</small></h1>
  <div class="course" role="group" aria-label="Course"><button data-c="g6" aria-pressed="true">6th Advanced</button><button data-c="a7" aria-pressed="false">7th Advanced</button><button data-c="g8" aria-pressed="false">Grade 8</button><button data-c="a1ms" aria-pressed="false">Algebra I · MS</button><button data-c="a1hs" aria-pressed="false">Algebra I · HS</button></div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Type a TEKS (6.4B, 8.5I, A.5A) or a lesson word (ratio, slope, quadratic)" autocomplete="off" aria-label="Search standards and lessons">
  </div>
</header>

<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-view="std">By standard</button>
  <button role="tab" aria-selected="false" data-view="les">By lesson</button>
  <button role="tab" aria-selected="false" data-view="grid">Full grid</button>
  <button role="tab" aria-selected="false" data-view="perf">STAAR performance</button>
  <button role="tab" aria-selected="false" data-view="cal">Calendar</button>
</div>

<main>
  <div class="legend" aria-label="Key" id="legend"></div>

  <section class="view on" id="view-std">
    <div class="split">
      <div class="pane">
        <div class="filters">
          <label><input type="checkbox" id="fR"> Readiness only</label>
          <label><input type="checkbox" id="fCov"> Only standards taught in this course</label>
          <label id="f7wrap"><input type="checkbox" id="f7"> Grade 7 TEKS</label>
          <label><input type="checkbox" id="fTest"> Tested on 2025 or 2026 STAAR</label>
          <span class="qtog" id="fQ" aria-label="Taught in quarter">Taught in: <button data-q="1" aria-pressed="false">Q1</button><button data-q="2" aria-pressed="false">Q2</button><button data-q="3" aria-pressed="false">Q3</button><button data-q="4" aria-pressed="false">Q4</button></span>
        </div>
        <div id="strands"></div>
      </div>
      <div class="detail" id="detail"></div>
    </div>
  </section>

  <section class="view" id="view-les">
    <div class="modlist" id="modlist"></div>
  </section>

  <section class="view" id="view-grid">
    <div class="gridctl">
      <span>Show modules:</span>
      <span id="gridmods"></span>
      <label><input type="checkbox" id="gHideEmpty" checked> Hide standards with no dots</label>
    </div>
    <div class="gridwrap"><table class="grid" id="grid"></table></div>
  </section>
  <section class="view" id="view-perf">
    <div class="pctl">
      <span>Statewide percent correct on each released STAAR item, by TEKS. Click a column header to sort; click a code to open it.</span>
      <label id="pGwrap">Test: <select id="pG"></select></label>
      <label><input type="checkbox" id="pR"> Readiness only</label>
      <label><input type="checkbox" id="pLow"> Items under 50% only</label>
    </div>
    <table class="ptab" id="ptab"></table>
  </section>

  a1ms:{key:'a1ms',name:'Algebra I (MS)',title:'Algebra I (Middle School) · TEKS Lookup',ipc:'Algebra 1 (MS)',data:{"modules": [{"n": 1, "name": "Searching for Patterns", "topics": ["Quantities and Relationships", "Sequences", "Linear Regressions"]}, {"n": 2, "name": "Exploring Constant Change", "topics": ["Linear Functions", "Linear Equations and Inequalities", "Systems of Equations and Inequalities"]}, {"n": 3, "name": "Investigating Growth and Decay", "topics": ["Introduction to Exponential Functions", "Using Exponential Equations"]}, {"n": 4, "name": "Maximizing and Minimizing", "topics": ["Introduction to Quadratic Functions", "Solving Quadratic Equations"]}, {"n": 5, "name": "End of Course Performance Tasks", "topics": ["Performance Tasks"]}], "standards": [{"code": "A.2A", "type": "R", "desc": "Determine the domain and range of a linear function in mathematical problems; determine reasonable domain and range values for real-world situations, both continuous and discrete; and represent domain and range using inequalities."}, {"code": "A.2B", "type": "S", "desc": "Write linear equations in two variables in various forms, including y = mx + b, Ax + By = C, and y - y1 = m(x - x1), given one point and the slope and given two points."}, {"code": "A.2C", "type": "R", "desc": "Write linear equations in two variables given a table of values, a graph, and a verbal description."}, {"code": "A.2D", "type": "S", "desc": "Write and solve equations involving direct variation."}, {"code": "A.2E", "type": "S", "desc": "Write the equation of a line that contains a given point and is parallel to a given line."}, {"code": "A.2F", "type": "S", "desc": "Write the equation of a line that contains a given point and is perpendicular to a given line."}, {"code": "A.2G", "type": "S", "desc": "Write an equation of a line that is parallel or perpendicular to the X or Y axis and determine whether the slope of the line is zero or undefined."}, {"code": "A.2H", "type": "S", "desc": "Write linear inequalities in two variables given a table of values, a graph, and a verbal description."}, {"code": "A.2I", "type": "R", "desc": "Write systems of two linear equations given a table of values, a graph, and a verbal description."}, {"code": "A.3A", "type": "S", "desc": "Determine the slope of a line given a table of values, a graph, two points on the line, and an equation written in various forms, including y = mx + b, Ax + By = C, and y - y1 = m(x - x1)."}, {"code": "A.3B", "type": "R", "desc": "Calculate the rate of change of a linear function represented tabularly, graphically, or algebraically in context of mathematical and real-world problems."}, {"code": "A.3C", "type": "R", "desc": "Graph linear functions on the coordinate plane and identify key features, including x-intercept, y-intercept, zeros, and slope, in mathematical and real-world problems."}, {"code": "A.3D", "type": "R", "desc": "Graph the solution set of linear inequalities in two variables on the coordinate plane."}, {"code": "A.3E", "type": "S", "desc": "Determine the effects on the graph of the parent function f(x) = x when f(x) is replaced by af(x), f(x) + d, f(x - c), f(bx) for specific values of a, b, c, and d."}, {"code": "A.3F", "type": "S", "desc": "Graph systems of two linear equations in two variables on the coordinate plane and determine the solutions if they exist."}, {"code": "A.3G", "type": "S", "desc": "Estimate graphically the solutions to systems of two linear equations with two variables in real-world problems."}, {"code": "A.3H", "type": "S", "desc": "Graph the solution set of systems of two linear inequalities in two variables on the coordinate plane."}, {"code": "A.4A", "type": "S", "desc": "Calculate, using technology, the correlation coefficient between two quantitative variables and interpret this quantity as a measure of the strength of the linear association."}, {"code": "A.4B", "type": "S", "desc": "Compare and contrast association and causation in real-world problems."}, {"code": "A.4C", "type": "S", "desc": "Write, with and without technology, linear functions that provide a reasonable fit to data to estimate solutions and make predictions for real-world problems."}, {"code": "A.5A", "type": "R", "desc": "Solve linear equations in one variable, including those for which the application of the distributive property is necessary and for which variables are included on both sides."}, {"code": "A.5B", "type": "S", "desc": "Solve linear inequalities in one variable, including those for which the application of the distributive property is necessary and for which variables are included on both sides."}, {"code": "A.5C", "type": "R", "desc": "Solve systems of two linear equations with two variables for mathematical and real-world problems."}, {"code": "A.6A", "type": "R", "desc": "Determine the domain and range of quadratic functions and represent the domain and range using inequalities."}, {"code": "A.6B", "type": "S", "desc": "Write equations of quadratic functions given the vertex and another point on the graph, write the equation in vertex form (f(x) = a(x - h)² + k), and rewrite the equation from vertex form to standard form (f(x) = ax² + bx + c)."}, {"code": "A.6C", "type": "S", "desc": "Write quadratic functions when given real solutions and graphs of their related equations."}, {"code": "A.7A", "type": "R", "desc": "Graph quadratic functions on the coordinate plane and use the graph to identify key attributes, if possible, including x-intercept, y-intercept, zeros, maximum value, minimum values, vertex, and the equation of the axis of symmetry."}, {"code": "A.7B", "type": "S", "desc": "Describe the relationship between the linear factors of quadratic expressions and the zeros of their associated quadratic functions."}, {"code": "A.7C", "type": "R", "desc": "Determine the effects on the graph of the parent function f(x) = x² when f(x) is replaced by af(x), f(x) + d, f(x - c), f(bx) for specific values of a, b, c, and d."}, {"code": "A.8A", "type": "R", "desc": "Solve quadratic equations having real solutions by factoring, taking square roots, completing the square, and applying the quadratic formula."}, {"code": "A.8B", "type": "S", "desc": "Write, using technology, quadratic functions that provide a reasonable fit to data to estimate solutions and make predictions for real-world problems."}, {"code": "A.9A", "type": "S", "desc": "Determine the domain and range of exponential functions of the form f(x) = abˣ and represent the domain and range using inequalities."}, {"code": "A.9B", "type": "S", "desc": "Interpret the meaning of the values of a and b in exponential functions of the form f(x) = abˣ in real-world problems."}, {"code": "A.9C", "type": "R", "desc": "Write exponential functions in the form f(x) = abˣ (where b is a rational number) to describe problems arising from mathematical and real-world situations, including growth and decay."}, {"code": "A.9D", "type": "R", "desc": "Graph exponential functions that model growth and decay and identify key features, including y-intercept and asymptote, in mathematical and real-world problems."}, {"code": "A.9E", "type": "S", "desc": "Write, using technology, exponential functions that provide a reasonable fit to data and make predictions for real-world problems."}, {"code": "A.10A", "type": "S", "desc": "Add and subtract polynomials of degree one and degree two."}, {"code": "A.10B", "type": "S", "desc": "Multiply polynomials of degree one and degree two."}, {"code": "A.10C", "type": "S", "desc": "Determine the quotient of a polynomial of degree one and polynomial of degree two when divided by a polynomial of degree one and polynomial of degree two when the degree of the divisor does not exceed the degree of the dividend."}, {"code": "A.10D", "type": "S", "desc": "Rewrite polynomial expressions of degree one and degree two in equivalent forms using the distributive property."}, {"code": "A.10E", "type": "R", "desc": "Factor, if possible, trinomials with real factors in the form ax² + bx + c, including perfect square trinomials of degree two."}, {"code": "A.10F", "type": "S", "desc": "Decide if a binomial can be written as the difference of two squares and, if possible, use the structure of a difference of two squares to rewrite the binomial."}, {"code": "A.11A", "type": "S", "desc": "Simplify numerical radical expressions involving square roots."}, {"code": "A.11B", "type": "R", "desc": "Simplify numeric and algebraic expressions using the laws of exponents, including integral and rational exponents."}, {"code": "A.12A", "type": "S", "desc": "Decide whether relations represented verbally, tabularly, graphically, and symbolically define a function."}, {"code": "A.12B", "type": "S", "desc": "Evaluate functions, expressed in function notation, given one or more elements in their domains."}, {"code": "A.12C", "type": "S", "desc": "Identify terms of arithmetic and geometric sequences when the sequences are given in function form using recursive processes."}, {"code": "A.12D", "type": "S", "desc": "Write a formula for the nth term of arithmetic and geometric sequences, given the value of several of their terms."}, {"code": "A.12E", "type": "S", "desc": "Solve mathematic and scientific formulas, and other literal equations, for a specified variable."}], "lessons": [{"id": "M1.T1.L1", "m": 1, "t": 1, "l": 1, "title": "A Picture Is Worth a Thousand Words", "sub": "Understanding Quantities and Their Relationships", "marks": [["A.3C", "O"], ["A.7A", "O"], ["A.9D", "O"]]}, {"id": "M1.T1.L2", "m": 1, "t": 1, "l": 2, "title": "A Sort of Sorts", "sub": "Analyzing and Sorting Graphs", "marks": [["A.3C", "O"], ["A.7A", "O"], ["A.9D", "O"]]}, {"id": "M1.T1.L3", "m": 1, "t": 1, "l": 3, "title": "F of X", "sub": "Recognizing Functions and Function Families", "marks": [["A.2A", "O"], ["A.3C", "O"], ["A.6A", "O"], ["A.7A", "O"], ["A.9A", "O"], ["A.9D", "O"], ["A.12A", "F"]]}, {"id": "M1.T1.L4", "m": 1, "t": 1, "l": 4,   a1hs:{key:'a1hs',name:'Algebra I (HS)',title:'Algebra I (High School) · TEKS Lookup',ipc:'Algebra 1 (HS)',data:{"modules": [{"n": 1, "name": "Searching for Patterns", "topics": ["Quantities and Relationships", "Sequences", "Linear Regressions"]}, {"n": 2, "name": "Exploring Constant Change", "topics": ["Linear Functions", "Linear Equations and Inequalities", "Systems of Equations and Inequalities"]}, {"n": 3, "name": "Investigating Growth and Decay", "topics": ["Introduction to Exponential Functions", "Using Exponential Equations"]}, {"n": 4, "name": "Maximizing and Minimizing", "topics": ["Introduction to Quadratic Functions", "Solving Quadratic Equations"]}, {"n": 5, "name": "End of Course Performance Tasks", "topics": ["Performance Tasks"]}], "standards": [{"code": "A.2A", "type": "R", "desc": "Determine the domain and range of a linear function in mathematical problems; determine reasonable domain and range values for real-world situations, both continuous and discrete; and represent domain and range using inequalities."}, {"code": "A.2B", "type": "S", "desc": "Write linear equations in two variables in various forms, including y = mx + b, Ax + By = C, and y - y1 = m(x - x1), given one point and the slope and given two points."}, {"code": "A.2C", "type": "R", "desc": "Write linear equations in two variables given a table of values, a graph, and a verbal description."}, {"code": "A.2D", "type": "S", "desc": "Write and solve equations involving direct variation."}, {"code": "A.2E", "type": "S", "desc": "Write the equation of a line that contains a given point and is parallel to a given line."}, {"code": "A.2F", "type": "S", "desc": "Write the equation of a line that contains a given point and is perpendicular to a given line."}, {"code": "A.2G", "type": "S", "desc": "Write an equation of a line that is parallel or perpendicular to the X or Y axis and determine whether the slope of the line is zero or undefined."}, {"code": "A.2H", "type": "S", "desc": "Write linear inequalities in two variables given a table of values, a graph, and a verbal description."}, {"code": "A.2I", "type": "R", "desc": "Write systems of two linear equations given a table of values, a graph, and a verbal description."}, {"code": "A.3A", "type": "S", "desc": "Determine the slope of a line given a table of values, a graph, two points on the line, and an equation written in various forms, including y = mx + b, Ax + By = C, and y - y1 = m(x - x1)."}, {"code": "A.3B", "type": "R", "desc": "Calculate the rate of change of a linear function represented tabularly, graphically, or algebraically in context of mathematical and real-world problems."}, {"code": "A.3C", "type": "R", "desc": "Graph linear functions on the coordinate plane and identify key features, including x-intercept, y-intercept, zeros, and slope, in mathematical and real-world problems."}, {"code": "A.3D", "type": "R", "desc": "Graph the solution set of linear inequalities in two variables on the coordinate plane."}, {"code": "A.3E", "type": "S", "desc": "Determine the effects on the graph of the parent function f(x) = x when f(x) is replaced by af(x), f(x) + d, f(x - c), f(bx) for specific values of a, b, c, and d."}, {"code": "A.3F", "type": "S", "desc": "Graph systems of two linear equations in two variables on the coordinate plane and determine the solutions if they exist."}, {"code": "A.3G", "type": "S", "desc": "Estimate graphically the solutions to systems of two linear equations with two variables in real-world problems."}, {"code": "A.3H", "type": "S", "desc": "Graph the solution set of systems of two linear inequalities in two variables on the coordinate plane."}, {"code": "A.4A", "type": "S", "desc": "Calculate, using technology, the correlation coefficient between two quantitative variables and interpret this quantity as a measure of the strength of the linear association."}, {"code": "A.4B", "type": "S", "desc": "Compare and contrast association and causation in real-world problems."}, {"code": "A.4C", "type": "S", "desc": "Write, with and without technology, linear functions that provide a reasonable fit to data to estimate solutions and make predictions for real-world problems."}, {"code": "A.5A", "type": "R", "desc": "Solve linear equations in one variable, including those for which the application of the distributive property is necessary and for which variables are included on both sides."}, {"code": "A.5B", "type": "S", "desc": "Solve linear inequalities in one variable, including those for which the application of the distributive property is necessary and for which variables are included on both sides."}, {"code": "A.5C", "type": "R", "desc": "Solve systems of two linear equations with two variables for mathematical and real-world problems."}, {"code": "A.6A", "type": "R", "desc": "Determine the domain and range of quadratic functions and represent the domain and range using inequalities."}, {"code": "A.6B", "type": "S", "desc": "Write equations of quadratic functions given the vertex and another point on the graph, write the equation in vertex form (f(x) = a(x - h)² + k), and rewrite the equation from vertex form to standard form (f(x) = ax² + bx + c)."}, {"code": "A.6C", "type": "S", "desc": "Write quadratic functions when given real solutions and graphs of their related equations."}, {"code": "A.7A", "type": "R", "desc": "Graph quadratic functions on the coordinate plane and use the graph to identify key attributes, if possible, including x-intercept, y-intercept, zeros, maximum value, minimum values, vertex, and the equation of the axis of symmetry."}, {"code": "A.7B", "type": "S", "desc": "Describe the relationship between the linear factors of quadratic expressions and the zeros of their associated quadratic functions."}, {"code": "A.7C", "type": "R", "desc": "Determine the effects on the graph of the parent function f(x) = x² when f(x) is replaced by af(x), f(x) + d, f(x - c), f(bx) for specific values of a, b, c, and d."}, {   g8:{key:'g8',name:'Grade 8',title:'Grade 8 · TEKS Lookup',ipc:'Grade 8 Math',data:{"modules": [{"n": 1, "name": "Transforming Geometric Objects", "topics": ["Rigid Motion Transformations", "Similarity", "Line and Angle Relationships"]}, {"n": 2, "name": "Developing Function Foundations", "topics": ["From Proportions to Linear Relationships", "Linear Relationships", "Introduction to Functions"]}, {"n": 3, "name": "Data Data Everywhere", "topics": ["Patterns in Bivariate Data", "Variability and Sampling"]}, {"n": 4, "name": "Modeling Linear Equations", "topics": ["Solving Linear Equations", "Systems of Linear Equations"]}, {"n": 5, "name": "Applying Powers", "topics": ["Real Numbers", "The Pythagorean Theorem", "Financial Literacy: Your Financial Future", "Volume of Curved Figures"]}], "standards": [{"code": "8.2A", "type": "S", "desc": "Extend previous knowledge of sets and subsets using a visual representation to describe relationships between sets of real numbers."}, {"code": "8.2B", "type": "S", "desc": "Approximate the value of an irrational number, including π and square roots of numbers less than 225, and locate that rational number approximation on a number line."}, {"code": "8.2C", "type": "S", "desc": "Convert between standard decimal notation and scientific notation."}, {"code": "8.2D", "type": "R", "desc": "Order a set of real numbers arising from mathematical and real-world contexts."}, {"code": "8.3A", "type": "S", "desc": "Generalize that the ratio of corresponding sides of similar shapes are proportional, including a shape and its dilation."}, {"code": "8.3B", "type": "S", "desc": "Compare and contrast the attributes of a shape and its dilation(s) on a coordinate plane."}, {"code": "8.3C", "type": "R", "desc": "Use an algebraic representation to explain the effect of a given positive rational scale factor applied to two-dimensional figures on a coordinate plane with the origin as the center of dilation."}, {"code": "8.4A", "type": "S", "desc": "Use similar right triangles to develop an understanding that slope, m, given as the rate comparing the change in y-values to the change in x-values, (y2 - y1)/ (x2 - x1), is the same for any two points (x1, y1) and (x2, y2) on the same line."}, {"code": "8.4B", "type": "R", "desc": "Graph proportional relationships, interpreting the unit rate as the slope of the line that models the relationship."}, {"code": "8.4C", "type": "R", "desc": "Use data from a table or graph to determine the rate of change or slope and y-intercept in mathematical and real-world problems."}, {"code": "8.5A", "type": "S", "desc": "Represent linear proportional situations with tables, graphs, and equations in the form of y = kx."}, {"code": "8.5B", "type": "S", "desc": "Represent linear non-proportional situations with tables, graphs, and equations in the form of y = mx + b, where b ≠ 0."}, {"code": "8.5C", "type": "S", "desc": "Contrast bivariate sets of data that suggest a linear relationship with bivariate sets of data that do not suggest a linear relationship from a graphical representation."}, {"code": "8.5D", "type": "R", "desc": "Use a trend line that approximates the linear relationship between bivariate sets of data to make predictions."}, {"code": "8.5E", "type": "S", "desc": "Solve problems involving direct variation."}, {"code": "8.5F", "type": "S", "desc": "Distinguish between proportional and non-proportional situations using tables, graphs, and equations in the form y = kx or y = mx + b, where b ≠ 0."}, {"code": "8.5G", "type": "R", "desc": "Identify functions using sets of ordered pairs, tables, mappings, and graphs."}, {"code": "8.5H", "type": "S", "desc": "Identify examples of proportional and non-proportional functions that arise from mathematical and real-world problems."}, {"code": "8.5I", "type": "R", "desc": "Write an equation in the form y = mx + b to model a linear relationship between two quantities using verbal, numerical, tabular, and graphical representations."}, {"code": "8.6A", "type": "S", "desc": "Describe the volume formula V = Bh of a cylinder in terms of its base area and its height."}, {"code": "8.6B", "type": "U", "desc": "Model the relationship between the volume of a cylinder and a cone having both congruent bases and heights and connect that relationship to the formulas."}, {"code": "8.6C", "type": "S", "desc": "Use models and diagrams to explain the Pythagorean theorem."}, {"code": "8.7A", "type": "R", "desc": "Solve problems involving the volume of cylinders, cones, and spheres."}, {"code": "8.7B", "type": "R", "desc": "Use previous knowledge of surface area to make connections to the formulas for lateral and total surface area and determine solutions for problems involving rectangular prisms, triangular prisms, and cylinders."}, {"code": "8.7C", "type": "R", "desc": "Use the Pythagorean Theorem and its converse to solve problems."}, {"code": "8.7D", "type": "S", "desc": "Determine the distance between two points on a coordinate plane using the Pythagorean Theorem."}, {"code": "8.8A", "type": "S", "desc": "Write one-variable equations or inequalities with variables on both sides that represent problems using rational number coefficients and constants."}, {"code": "8.8B", "type": "S", "desc": "Write a corresponding real-world problem when given a one-variable equation or inequality with variables on both sides of the equal sign using rational number coefficients and constants."}, {"code": "8.8C", "type": "R", "desc": "Model and solve one-variable equations with variables on both sides of the equal sign that represent mathematical and real-world problems using rational number coefficients and constants."}, {"code": "8.8D", "type": "S", "desc": "Use informal arguments to establish facts about the angle sum and exterior angle of triangles, the angles created when parallel lines are cut by a transversal, and the angle-angle criterion for similarity of triangles."}, {"code": "8.9A", "type": "S", "desc": "Identify and verify the values of x and y that simultaneously satisfy two linear equations in the form y = mx + b from the intersections of the graphed equations."}, {"code": "8.10A", "type": "S", "desc": "Generalize the properties of orientation and congruence of rotations, reflections, translations, and dilations of two-dimensional shapes on a coordinate plane."}, {"code": "8.10B", "type": "S", "desc": "Differentiate between transformations that preserve congruence and those that do not."}, {"code": "8.10C", "type": "R", "desc": "Explain the effect of translations, reflections over the x- or y-axis, and rotations limited to 90°, 180°, 270°, and 360° as applied to two-dimensional shapes on a coordinate plane using an algebraic representation."}, {"code": "8.10D", "type": "S", "desc": "Model the effect on linear and area measurements of dilated two-dimensional shapes."}, {"code": "8.11A", "type": "S", "desc": "Construct a scatterplot and describe the observed data to address questions of association such as linear, non-linear, and no association between bivariate data."}, {"code": "8.11B", "type": "S", "desc": "Determine the mean absolute deviation and use this quantity as a measure of the average distance data are from the mean using a data set of no more than 10 data points."}, {"code": "8.11C", "type": "U", "desc": "Simulate generating random samples of the same size from a population with known characteristics to develop the notion of a random sample being representative of the population from which it was selected."}, {"code": "8.12A", "type": "S", "desc": "Solve real-world problems comparing how interest rate and loan length affect the cost of credit."}, {"code": "8.12B", "type": "U", "desc": "Calculate the total cost of repaying a loan, including credit cards and easy access loans, under various rates of interest and over different periods using an online calculator."}, {"code": "8.12C", "type": "S", "desc": "Explain how small amounts of money invested regularly, including money saved for college and retirement, grow over time."}, {"code": "8.12D", "type": "R", "desc": "Calculate and compare simple interest and compound interest earnings."}, {"code": "8.12E", "type": "U", "desc": "Identify and explain the advantages and disadvantages of different payment methods."}, {"code": "8.12F", "type": "U", "desc": "Analyze situations to determine if they represent financially responsible decisions and identify the benefits of financial responsibility and the costs of financial irresponsibility."}, {"code": "8.12G", "type": "S", "desc": "Estimate the cost of a two-year and four-year college education, including family contribution, and devise a periodic savings plan for accumulating the money needed to contribute to the total cost of attendance for at least the first year of college."}], "lessons": [{"id": "M1.T1.L1", "m": 1, "t": 1, "l": 1, "title": "Patty Paper, Patty Paper", "sub": "Introduction to Congruent Figures", "marks": [["8.10A", "O"]]}, {"id": "M1.T1.L2", "m": 1, "t": 1, "l": 2, "title": "Slides, Flips, and Spins", "sub": "Introduction to Rigid Motions", "marks": [["8.10A", "O"], ["8.10B", "F"]]}, {"id": "M1.T1.L3", "m": 1, "t": 1, "l": 3, "title": "Lateral Moves", "sub": "Translations of Figures on the Coordinate Plane", "marks": [["8.10A", "O"], ["8.10C", "O"]]}, {"id": "M1.T1.L4", "m": 1, "t": 1, "l": 4, "title": "Mirror, Mirror", "sub": "Reflections of Figures on the Coordinate Plane", "marks": [["8.10A", "O"], ["8.10C", "O"]]}, {"id": "M1.T1.L5", "m": 1, "t": 1, "l": 5, "title": "Half Turns and Quarter Turns", "sub": "Rotations of Figures on the Coordinate Plane", "marks": [["8.10A", "O"], ["8.10C", "F"]]}, {"id": "M1.T1.L6", "m": 1, "t": 1, "l": 6, "title": "Every Which Way", "sub": "Combining Rigid Motions", "marks": [["8.10A", "O"], ["8.10C", "F"]]}, {"id": "M1.T2.L1", "m": 1, "t": 2, "l": 1, "title": "Pinch-Zoom Geometry", "sub": "Dilations of Figures", "marks": [["8.3A", "F"], ["8.10A", "O"]]}, {"id": "M1.T2.L2", "m": 1, "t": uent bases and heights and connect that relationship to the formulas."}, {"code": "7.8B", "type": "U", "desc": "Explain verbally and symbolically the relationship between the volume of a triangular prism and a triangular pyramid having both congruent bases and heights and connect that relationship to the formulas."}, {"code": "7.8C", "type": "U", "desc": "Use models to determine the approximate formulas for the circumference and area of a circle and connect the models to the actual formulas."}, {"code": "7.9A", "type": "R", "desc": "Solve problems involving the volume of rectangular prisms, triangular prisms, rectangular pyramids, and triangular pyramids."}, {"code": "7.9B", "type": "R", "desc": "Determine the circumference and area of circles."}, {"code": "7.9C", "type": "R", "desc": "Determine the area of composite figures containing combinations of rectangles, squares, parallelograms, trapezoids, triangles, semicircles, and quarter circles."}, {"code": "7.9D", "type": "S", "desc": "Solve problems involving the lateral and total surface area of a rectangular prism, rectangular pyramid, triangular prism, and triangular pyramid by determining the area of the shape's net."}, {"code": "7.10A", "type": "S", "desc": "Write one-variable, two-step equations and inequalities to represent constraints or conditions within problems."}, {"code": "7.10B", "type": "S", "desc": "Represent solutions for one-variable, two-step equations and inequalities on number lines."}, {"code": "7.10C", "type": "S", "desc": "Write a corresponding real-world problem given a one-variable, two-step equation or inequality."}, {"code": "7.11A", "type": "R", "desc": "Model and solve one-variable, two-step equations and inequalities."}, {"code": "7.11B", "type": "S", "desc": "Determine if the given value(s) make(s) one-variable, two-step equations and inequalities true."}, {"code": "7.11C", "type": "S", "desc": "Write and solve equations using geometry concepts, including the sum of the angles in a triangle, and angle relationships."}, {"code": "7.12A", "type": "R", "desc": "Compare two groups of numeric data using comparative dot plots or box plots by comparing their shapes, centers, and spreads."}, {"code": "7.12B", "type": "S", "desc": "Use data from a random sample to make inferences about a population."}, {"code": "7.12C", "type": "S", "desc": "Compare two populations based on data in random samples from these populations, including informal comparative inferences about differences between the two populations."}, {"code": "7.13A", "type": "S", "desc": "Calculate the sales tax for a given purchase and calculate income tax for earned wages."}, {"code": "7.13B", "type": "S", "desc": "Identify the components of a personal budget, including income; planned savings for college, retirement, and emergencies; taxes; and fixed and variable expenses, and calculate what percentage each category comprises of the total budget."}, {"code": "7.13C", "type": "S", "desc": "Create and organize a financial assets and liabilities record and construct a net worth statement."}, {"code": "7.13D", "type": "S", "desc": "Use a family budget estimator to determine the minimum household budget and average hourly wage needed for a family to meet its basic needs in the student's city or another large city nearby."}, {"code": "7.13E", "type": "S", "desc": "Calculate and compare simple interest and compound interest earnings."}, {"code": "7.13F", "type": "S", "desc": "Analyze and compare monetary incentives, including sales, rebates, and coupons."}, {"code": "7.2A", "type": "S", "desc": "Extend previous knowledge of sets and subsets using a visual representation to describe relationships between sets of rational numbers."}, {"code": "7.7A", "type": "R", "desc": "Represent linear relationships using verbal descriptions, tables, graphs, and equations that simplify to the form y = mx + b."}, {"code": "8.2A", "type": "S", "desc": "Extend previous knowledge of sets and subsets using a visual re ntrast bivariate sets of data that suggest a linear relationship with bivariate sets of data that do not suggest a linear relationship from a graphical representation."}, {"code": "8.5D", "type": "R", "desc": "Use a trend line that approximates the linear relationship between bivariate sets of data to make predictions."}, {"code": "8.5E", "type": "S", "desc": "Solve problems involving direct variation."}, {"code": "8.5F", "type": "S", "desc": "Distinguish between proportional and non-proportional situations using tables, graphs, and equations in the form y = kx or y = mx + b, where b ≠ 0."}, {"code": "8.5G", "type": "R", "desc": "Identify functions using sets of ordered pairs, tables, mappings, and graphs."}, {"code": "8.5H", "type": "S", "desc": "Identify examples of proportional and non-proportional functions that arise from mathematical and real-world problems."}, {"code": "8.5I", "type": "R", "desc": "Write an equation in the form y = mx + b to model a linear relationship between two quantities using verbal, numerical, tabular, and graphical representations."}, {"code": "8.6A", "type": "S", "desc": "Describe the volume formula V = Bh of a cylinder in terms of its base area and its height."}, {"code": "8.6B", "type": "U", "desc": "Model the relationship between the volume of a cylinder and a cone having both congruent bases and heights and connect that relationship to the formulas."}, {"code": "8.6C", "type": "S", "desc": "Use models and diagrams to explain the Pythagorean theorem."}, {"code": "8.7A", "type": "R", "desc": "Solve problems involving the volume of cylinders, cones, and spheres."}, {"code": "8.7B", "type": "R", "desc": "Use previous knowledge of surface area to make connections to the formulas for lateral and total surface area and determine solutions for problems involving rectangular prisms, triangular prisms, and cylinders."}, {"code": "8.7C", "type": "R", "desc": "Use the Pythagorean Theorem and its converse to solve problems."}, {"code": "8.7D", function gradeOf(c){ return c.split('.')[0]; }
function gRank(g){ return g==='2A'?10:g==='A'?9:g==='K'?0:+g; }
function gName(g){ return g==='A'?'Algebra I':g==='2A'?'Algebra II':'Grade '+g; }
function testName(g){ return g==='A'?'Algebra I EOC':'Grade '+g+' STAAR'; }
function renderAlign(code){
  const g=gradeOf(code);
  let blocks=SCAF.filter(b=>String(b.src)===g && b.ses.some(s=>s.code===code));
  if(!blocks.length) blocks=SCAF.filter(b=>b.ses.some(s=>s.code===code));
  const gr0=gRank(g), lo=g==='6'?5:g==='A'?6:gr0-2, hi=g==='6'?7:g==='A'?10:8;
  if(!blocks.length) return `<div class="perf va"><h4>Vertical alignment</h4><p class="notested">${code} is not placed in any cluster of the lead4ward TEKS Scaffold.</p></div>`;
  let html=`<div class="perf va"><h4>Vertical alignment</h4><p class="note">lead4ward TEKS Scaffold, Math ${gName(String(blocks[0].src))} — Grade ${lo} through ${hi===10?'Algebra II':'Grade '+hi} expectations in the same cluster. ${gName(g)} rows are marked in teal; ▸ marks lead4ward's starting point for checking understanding.</p>`;
  for(const b of blocks){
    const sum=gr=>b.ses.filter(s=>gRank(gradeOf(s.code))===gr&&s.code!==code).map(s=>s.code); const rn=r=>r===10?'Algebra II':r===9?'Algebra I':'Grade '+r;
    html+=`<p class="sum"><b>${esc(b.cluster)}</b> › ${esc(b.sub)}`;
    const btn=c=>STD.has(c)?`<button class="mk ${STD.get(c).type}" data-code="${c}">${c}</button>`:`<span class="mk">${c}</span>`;
    for(let gr=gr0-1;gr>=lo;gr--){ const l=sum(gr); if(l.length) html+=`<br>Builds on ${rn(gr)}: ${l.map(btn).join(' ')}`; }
    for(let gr=gr0+1;gr<=hi;gr++){ if(g==='A'&&gr===9) continue; const l=sum(gr); html+=`<br>Leads to ${rn(gr)}: ${l.length?l.map(btn).join(' '):'—'}`; }
    html+='</p><ol class="ladder">';
    let lastG=null;
    for(const s of b.ses){
      const sg=gradeOf(s.code); if(!(gRank(sg)>=lo && gRank(sg)<=hi)) continue; const cls=(s.code===code?'me':sg===g?'g6':'');
      const known=STD.has(s.code);
      html+=`<li class="${cls}"><span class="c">${sg!==lastG?`<span class="gr">${gName(sg)}</span>`:''}${s.start?'▸ ':''}${known&&s.code!==code?`<button data-code="${s.code}">${s.code}</button>`:s.code}<span class="ty">${s.type==='R'?'Readiness':s.type==='S'?'Supporting':s.type==='NT'?'Not tested':''}</span></span><span class="t">${esc(s.text)}</span></li>`;
      lastG=sg;
    }
    html+='</ol>';
  }
  return html+'</div>';
}

let calQ=0;
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekOfDate(iso){ return CAL.find(w=>w.days[0].date<=iso && iso<=w.days[4].date); }
function buildCal(){
  const today=todayISO(); const tw=weekOfDate(today);
  const weeks=CAL.filter(w=>!calQ||w.q===calQ);
  let html='<thead><tr><th>Week</th>'+['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<th>${d}</th>`).join('')+'</tr></thead><tbody>';
  let curQ=0;
  for(const w of weeks){
    if(w.q!==curQ){ curQ=w.q; const qd=PACE.cal.quarters[w.q]; html+=`<tr class="qhead"><td colspan="6">Quarter ${w.q} · ${fdr(qd.start,qd.end)}</td></tr>`; }
    const isTW=tw&&tw.q===w.q&&tw.wk===w.wk;
    html+=`<tr id="calwk-${w.q}-${w.wk}" class="${isTW?'thisweek':''}"><td class="wk"><b>Q${w.q} · Wk ${w.wk}</b><span>${fdr(w.days[0].date,w.days[4].date)}</span></td>`;
    for(const d of w.days){
      const L=d.lid?LES_BY_ID.get(d.lid):null;
      const hit=L&&sel&&L.marks.some(m=>m[0]===sel);
      const dnum=d.date.split('-')[2]*1, mon=MON[d.date.split('-')[1]*1-1];
      let body='';
      if(L){
        const mk=L.marks.map(mkBtn).join('');
        body=`${d.re?'<span class="reflag">SMC 3 response · revisit</span>':''}<button class="ttl" data-id="${L.id}">${esc(L.title)}</button><div class="sub">M${L.m}·T${L.t}·L${L.l}${L.sub?' · '+esc(L.sub):''}</div><div class="mks">${mk}</div>${d.act?`<div class="act">${esc(d.act)}</div>`:''}`;
      } else body=`<div class="txt">${esc(d.text)}</div>${d.act?`<div class="act">${esc(d.act)}</div>`:''}`;
      html+=`<td><div class="day k-${d.kind}${d.re?' re':''}${d.date===today?' today':''}${hit?' hit':''}"><div class="d"><b>${mon} ${dnum}</b>${d.dow}</div>${body}</div></td>`;
    }
    html+='</tr>';
  }
  $('cal').innerHTML=html+'</tbody>';
  $('cal').querySelectorAll('button.ttl').forEach(b=>b.addEventListener('click',()=>openLesson(b.dataset.id)));
  $('cal').querySelectorAll('button.mk[data-code]').forEach(b=>b.addEventListener('click',()=>selectStd(b.dataset.code)));
  $('calSel').textContent=sel?`Days that teach ${sel} are outlined in amber.`:'Pick a standard on the By standard tab to outline the days that teach it.';
  const nowBtn=$('calQ').querySelector(`button[data-q="${tw?tw.q:0}"]`); $('calQ').querySelectorAll('button').forEach(b=>b.classList.remove('now')); if(tw&&nowBtn) nowBtn.classList.add('now');
}
function calGoto(q,wk){
  showView('cal'); if(calQ&&calQ!==q){ calQ=0; $('calQ').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.q==='0')); buildCal(); }
  const row=$(`calwk-${q}-${wk}`); if(row){ row.scrollIntoView({block:'center'}); row.style.outline='3px solid var(--focus)'; setTimeout(()=>row.style.outline='',1800); }
}
$('calQ').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ calQ=+b.dataset.q; $('calQ').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); buildCal(); }));
$('calToday').addEventListener('click',()=>{ const tw=weekOfDate(todayISO()); if(tw) calGoto(tw.q,tw.wk); else alert('Today is outside the 2026-27 IPC.'); });
document.addEventListener('click',e=>{ const w=e.target.closest('.when.link'); if(w) calGoto(+w.dataset.q,+w.dataset.wk); });

/* ---------- search ---------- */
$('q').addEventListener('input',e=>{
  query=e.target.value;
  applyStdFilters(); applyLessonFilter();
  const q=query.trim().toUpperCase();
  if(STD.has(q)) selectStd(q);
  else { sel=null; document.querySelectorAll('#strands .chip').forEach(b=>b.classList.remove('sel')); q?renderSearch(query):renderDetail(null); highlightGrid(); }
});
function renderSearch(raw){
  const q=raw.trim().toLowerCase(); const host=$('detail');
  const stds=DATA.standards.filter(s=>s.code.toLowerCase().startsWith(q)||s.desc.toLowerCase().includes(q));
  const les=DATA.lessons.filter(L=>(L.title+' '+L.sub+' '+MOD.get(L.m).topics[L.t-1]).toLowerCase().includes(q));
  if(!stds.length && !les.length){ host.innerHTML=`<p class="empty">Nothing matches “${esc(raw)}”. Try a TEKS code (8.5I) or a shorter word.</p>`; return; }
  let html=`<p class="count">Results for “${esc(raw)}” · ${stds.length} standard${stds.length===1?'':'s'} · ${les.length} lesson${les.length===1?'':'s'}</p>`;
  if(stds.length){
    html+='<div class="mod"><h4>Standards</h4><div class="chips">'+stds.map(s=>`<button class="chip ${s.type}${BY_STD.get(s.code).length?'':' none'}" data-code="${s.code}" title="${esc(s.desc)}">${s.code}</button>`).join('')+'</div></div>';
  }
  if(les.length){
    let curM=0;
    for(const L of les){
      if(L.m!==curM){ if(curM) html+='</div>'; curM=L.m; html+=`<div class="mod"><h4>Module ${L.m}: ${esc(MOD.get(L.m).name)}</h4>`; }
      const marks=L.marks.length?L.marks.map(mkBtn).join(' '):'<span class="mk none">no TEKS listed</span>';
      html+=`<div class="lesson" style="cursor:default"><span></span><span><span class="where">${lessonWhere(L)} · ${esc(MOD.get(L.m).topics[L.t-1])}</span><br><b>${esc(L.title)}</b> ${subOf(L)}<span class="whenrow">${paceTag(L.id)}</span><br><span class="marks" style="display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:6px">${marks}</span></span></div>`;
    }
    html+='</div>';
  }
  host.innerHTML=html;
  host.querySelectorAll('[data-code]').forEach(b=>b.addEventListener('click',()=>selectStd(b.dataset.code)));
}
['fR','fCov','f7','fTest'].forEach(id=>$(id).addEventListener('change',applyStdFilters));
$('fQ').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ const q=+b.dataset.q; fQsel.has(q)?fQsel.delete(q):fQsel.add(q); b.setAttribute('aria-pressed',fQsel.has(q)); applyStdFilters(); }));
document.addEventListener('keydown',e=>{ if(e.key==='/' && document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); } });

function legendHTML(){
  const k=COURSE.key, ex=k==='a7', g6=k==='g6';
  const al=k.startsWith('a1'); const smp=g6?['6.4B','6.4C','6.14D']:al?['A.5A','A.5B','']:['8.5I','8.5H','8.12E'];
  return `<span class="lab">Key</span><span><i class="sample R">${smp[0]}</i>readiness standard</span><span><i class="sample">${smp[1]}</i>supporting standard</span>${smp[2]?`<span><i class="sample U">${smp[2]}</i>not assessed on STAAR</span>`:''}<span class="sep" aria-hidden="true"></span><span><i class="dot F"></i>${g6?'lesson focus standard':'fully covered in the lesson'}</span><span><i class="dot"></i>${g6?'also addressed in the lesson':'partially covered'}</span>${ex?'<span><i class="dot I"></i>TEKS listed on the IPC (Grade 7 lesson)</span>':''}<span class="sep" aria-hidden="true"></span><span><i class="when">Q1 Wk 6 · Sept 14</i>when the lesson is on the 2026-27 IPC</span>${g6||al?'':'<span><i class="when re">revisited</i>SMC 3 response day</span>'}`;
}
const SUB={g6:'Texas Math Solution (Carnegie Learning) · standards ↔ lessons · Grade 6 STAAR',a7:'Carnegie Grade 8 lessons with Grade 7 lessons placed in · standards ↔ lessons · Grade 8 STAAR',g8:'Texas Math Solution (Carnegie Learning) · standards ↔ lessons · Grade 8 STAAR',a1ms:'Texas Math Solution (Carnegie Learning) · middle school Algebra I IPC · Algebra I EOC',a1hs:'Texas Math Solution (Carnegie Learning) · high school Algebra I IPC (A/B block) · Algebra I EOC'};
const TESTS={g6:[['6','Grade 6 STAAR'],['7','Grade 7 STAAR (reference)']],a7:[['8','Grade 8 STAAR'],['7','Grade 7 STAAR (reference)']],g8:[['8','Grade 8 STAAR']],a1ms:[['A','Algebra I EOC']],a1hs:[['A','Algebra I EOC']]};
function loadCourse(k,keepSel=true){
  setCourse(k);
  try{ localStorage.setItem('teks678-course',k); }catch(e){}
  document.querySelectorAll('.course button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===k));
  $('ttl').firstChild.nodeValue=COURSE.title;
  $('subttl').textContent=SUB[k];
  document.title=COURSE.title;
  $('legend').innerHTML=legendHTML(); $('foot').innerHTML=FOOT[k];
  $('f7wrap').style.display=(k==='g6'||k==='a7')?'':'none'; $('f7').checked=k==='a7';
  $('pG').innerHTML=TESTS[k].map(([v,l])=>`<option value="${v}">${l}</option>`).join(''); $('pGwrap').style.display=TESTS[k].length>1?'':'none';
  buildStrands(); buildModList(); buildGridCtl(); buildGrid(); buildPerfTable(); buildCal(); applyStdFilters(); applyLessonFilter();
  if(keepSel && sel && STD.has(sel)) selectStd(sel,true);
  else { sel=null; if(query.trim()) renderSearch(query); else renderDetail(null); try{ history.replaceState(null,'','#'+k); }catch(e){} }
}
document.querySelectorAll('.course button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.c!==COURSE.key){ const v=document.querySelector('.view.on').id.slice(5); loadCourse(b.dataset.c); showView(v); } }));
/* ---------- init ---------- */
let h=''; try{ h=decodeURIComponent(location.hash.slice(1)); }catch(e){}
let ck=null, hc='';
{ const m=h.match(/^(g6|a7|g8|a1ms|a1hs)(?:\/(.*))?$/i); if(m){ ck=m[1].toLowerCase(); hc=(m[2]||'').toUpperCase(); } else hc=h.toUpperCase(); }
if(!ck){ try{ ck=localStorage.getItem('teks678-course'); }catch(e){} }
if(!COURSES[ck]) ck=(hc.startsWith('8.')?'g8':hc.startsWith('A.')?'a1ms':'g6');
loadCourse(ck,false);
if(STD.has(hc)) selectStd(hc,false);
